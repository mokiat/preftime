name: Release

on:
  push:
    tags: ['*']

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: ./scripts/build

      - name: Upload Distribution
        uses: actions/upload-artifact@v4
        with:
          name: Distribution
          path: ./target
